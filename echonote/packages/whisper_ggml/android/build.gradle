// [echonote] Restored from upstream whisper_ggml 2.4.0 and trimmed: no
// buildscript block (the app's AGP is used), arm64-v8a only, and CMake builds
// the same sources as iOS (see CMakeLists.txt).
group 'com.devac.whisper_flutter'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace "com.devac.whisper_ggml"
    ndkVersion "29.0.13113456"
    compileSdk 36

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 24
        // Keeps the bundled ffmpeg-kit classes in release builds (upstream
        // issue #16).
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            // [echonote] 64-bit ARM only: every 2026 device and the arm64
            // emulators. 32-bit and x86 are not supported.
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }
}
