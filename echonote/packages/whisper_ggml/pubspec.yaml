name: whisper_ggml
description: OpenAI Whisper ASR (Automatic Speech Recognition) for Flutter
version: 2.4.0
publish_to: none
repository: https://github.com/sk3llo/whisper_ggml

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter

  ffi: ^2.1.4
  # [echonote] PCM16 -> float for the live stream (see whisper_live.dart).
  echo_core:
    path: ../echo_core
  ffmpeg_kit_flutter_new_min: ^2.1.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  plugin_platform_interface: ^2.1.8
  universal_io: ^2.2.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  ffigen: ^18.1.0
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  very_good_analysis: ^7.0.0

topics:
  - 'ggml'
  - 'artificial-intelligence'
  - 'machine-learning'

flutter:
  uses-material-design: true
  plugin:
    platforms:
      # echonote: one copy of the native sources (ios/Classes); Android's
      # CMake builds them too (android/CMakeLists.txt).
      ios:
        ffiPlugin: true
      android:
        ffiPlugin: true